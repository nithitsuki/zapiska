name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  # Feature-combo job: the `webmentions` feature gates whole modules
  # (worker, SSRF, mf2, avatar). The comments-only build catches
  # feature-gate regressions the default build can't see.
  test-comments-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Build (comments only)
        run: cargo build --no-default-features --features comments --verbose
      - name: Run tests (comments only)
        run: cargo test --no-default-features --features comments --verbose

  # ── Smoke: compose stack boots and serves a healthy /healthz ──
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start compose stack
        run: |
          printf 'ADMIN_TOKEN=ci-smoke-token\nPUBLIC_TARGET_ORIGIN=https://example.com\nALLOWED_CORS_ORIGIN=https://example.com\n' > .env
          docker compose up -d --build
      - name: Wait for healthy /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz 2>/dev/null | grep -q '^ok$'; then
              echo "healthz ok on attempt $i"
              exit 0
            fi
            sleep 10
          done
          echo "healthz never answered ok"
          docker compose ps
          docker compose logs zapiska
          exit 1
      - name: Version endpoint
        run: curl -fsS http://127.0.0.1:3000/api/version
      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          rm -f .env

  # ── Release: cross-platform binaries, attached to the GitHub release ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, test-comments-only, smoke]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            apt: musl-tools
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install cross C toolchain (linux)
        if: runner.os == 'Linux' && matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Cross-compiler env for bundled sqlite (aarch64)
        # CC_* drives C build scripts (sqlite); -Clinker bypasses rustc's
        # host-lld shim, which can't link aarch64 objects. Verified locally
        # with the resulting binary booting under qemu-aarch64.
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-Clinker=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Smoke test binary (native linux)
        # The runners are x86_64 Linux, so only these two targets execute
        # here. Windows/macOS artifacts are compile-checked only; aarch64
        # gets the qemu step below instead of a native boot.
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          BIN="target/${{ matrix.target }}/release/zapiska"
          "$BIN" --version
          export ADMIN_TOKEN=ci-smoke-token BIND_ADDR=127.0.0.1:3000 DATABASE_PATH=/tmp/zapiska-ci-smoke.db
          rm -f /tmp/zapiska-ci-smoke.db /tmp/zapiska-ci-smoke.db.lock /tmp/zapiska-ci-smoke.db-wal /tmp/zapiska-ci-smoke.db-shm
          ("$BIN" & echo $! > /tmp/zapiska-ci-smoke.pid)
          STATUS=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz 2>/dev/null | grep -q '^ok$'; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/healthz | grep -q '^ok$' || STATUS=1
          curl -fsS http://127.0.0.1:3000/api/version || STATUS=1
          kill "$(cat /tmp/zapiska-ci-smoke.pid)" || true
          rm -f /tmp/zapiska-ci-smoke.db /tmp/zapiska-ci-smoke.db.lock /tmp/zapiska-ci-smoke.db-wal /tmp/zapiska-ci-smoke.db-shm /tmp/zapiska-ci-smoke.pid
          exit $STATUS
      - name: Smoke test binary under qemu (aarch64)
        # No ARM runner: run `--version` (needs no config) under qemu-user
        # with the cross libc as sysroot. A full boot stays manual — see
        # docs/deployment.md — because user-mode networking adds flakes.
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
          qemu-aarch64 --version
          qemu-aarch64 -L /usr/aarch64-linux-gnu "target/${{ matrix.target }}/release/zapiska" --version
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/zapiska.exe dist/ 2>/dev/null || \
            cp target/${{ matrix.target }}/release/zapiska dist/
          cp README.md dist/
          tar -czf zapiska-${{ matrix.name }}.tar.gz -C dist .
      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: zapiska-*.tar.gz
          generate_release_notes: true

  # ── Release: multi-arch Docker image on GHCR ──
  docker-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, test-comments-only, smoke]
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
